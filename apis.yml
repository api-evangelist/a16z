aid: a16z
name: Andreessen Horowitz
description: >-
  Andreessen Horowitz (a16z) is a Silicon Valley venture capital firm founded in July 2009 by Marc
  Andreessen and Ben Horowitz and headquartered in Menlo Park, California. The firm invests across the
  full lifecycle from seed to venture to growth-stage technology companies, deploying stage-based checks
  that range from roughly $1M-$5M into early application bets up to hundreds of millions of dollars into
  its largest AI positions. a16z organizes around dedicated practice areas: AI, American Dynamism,
  Bio + Healthcare, Consumer, Crypto, Enterprise, Fintech, Games, Infrastructure, plus specialty vehicles
  including the Cultural Leadership Fund, Perennial, and the Speedrun accelerator. With over $90B-$100B+ in
  assets under management as of early 2026 and a public portfolio of more than 1,000 companies, a16z is one
  of the largest and most influential venture firms in the world, known for its operator-led platform model
  and notable investments including Airbnb, Coinbase, GitHub, Figma, Stripe, Databricks, Anduril, and OpenAI.
